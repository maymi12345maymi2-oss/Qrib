<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قريب - Qrib</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --text: #ffffff;
      --mut: #aaaaaa;
      --blue: #2f81f3;
      --green: #238636;
      --border: #30363d;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: Tahoma, sans-serif;
      margin: 0;
      padding-bottom: 70px;
    }
    header {
      background: var(--card);
      padding: 15px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      font-size: 18px;
      font-weight: bold;
    }
    header.small {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
    }
    .page { display: none; padding: 15px; }
